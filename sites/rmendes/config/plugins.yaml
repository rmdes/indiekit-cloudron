# sites/rmendes/config/plugins.yaml
# Generated by scripts/manifest-from-current.mjs from the current Dockerfile.
# Only entries that differ from registry defaults are present (core is implicit).
#
# Edit this file (or use `make plugin-edit`) to enable/disable plugins for rmendes.
post_types:
  event:
    enabled: true
  jam:
    enabled: true
  rsvp:
    enabled: true
syndicators:
  mastodon:
    enabled: true
  bluesky:
    enabled: true
  linkedin:
    enabled: true
  indienews:
    enabled: true
endpoints:
  linkedin-oauth:
    enabled: true
  webmention-io:
    enabled: true
  github:
    enabled: true
  funkwhale:
    enabled: true
  lastfm:
    enabled: true
  youtube:
    enabled: true
  rss:
    enabled: true
  microsub:
    enabled: true
  podroll:
    enabled: true
  webmention-sender:
    enabled: true
  blogroll:
    enabled: true
  cv:
    enabled: true
  conversations:
    enabled: true
  comments:
    enabled: true
  readlater:
    enabled: true
  activitypub:
    enabled: true
  # Stripe donation campaigns — chardonsbleus only. Pinned explicitly because
  # the registry default flipped to true (for the public `default` image);
  # without this pin it would silently turn on here.
  donation:
    enabled: false
