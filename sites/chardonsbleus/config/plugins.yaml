# chardonsbleus.org plugin manifest
# Note: core is implicit (see plugin-registry/plugin-registry.yaml > core)
#
# Hand-written. chardonsbleus is a simpler site than rmendes — no music/code/
# video integrations, no fediverse, no microsub. Adds the donation endpoint.

post_types:
  event:  { enabled: false }
  jam:    { enabled: false }
  rsvp:   { enabled: false }
  audio:  { enabled: false }

syndicators:
  mastodon:  { enabled: true }
  bluesky:   { enabled: true }
  linkedin:  { enabled: true }   # paired with linkedin-oauth endpoint below
  # Pinned explicitly: the registry default flipped to true (for the public
  # `default` image); without this pin it would silently turn on here.
  indienews: { enabled: false }

endpoints:
  webmention-io:     { enabled: true }
  webmention-sender: { enabled: true }
  comments:          { enabled: true }
  blogroll:          { enabled: true }
  rss:               { enabled: true }
  youtube:           { enabled: true }
  linkedin-oauth:    { enabled: true }   # OAuth token manager for linkedin syndicator
  # Explicit disables for clarity (already disabled by default in registry)
  donation:          { enabled: true }    # Stripe-backed campaigns; needs STRIPE_SECRET_KEY + STRIPE_WEBHOOK_SECRET in env.sh
  cv:                { enabled: true }    # uses shared site.identity (post-unification)
  microsub:          { enabled: false }
  conversations:     { enabled: false }
  activitypub:       { enabled: false }
  github:            { enabled: false }
  funkwhale:         { enabled: false }
  lastfm:            { enabled: false }
  podroll:           { enabled: false }
  readlater:         { enabled: true }
  bluesky-pds:       { enabled: false }
