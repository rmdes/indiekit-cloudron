# Shared nginx configuration — server level (security headers).
# Included by nginx.conf.template and by per-site nginx.conf files.
#
# Order matters: an add_header at a deeper level stops every header here
# from being inherited for that request, so a location adding one of its
# own must repeat these.

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://fonts.googleapis.com; img-src 'self' data: https:; media-src 'self' https:; font-src 'self' https://fonts.gstatic.com; frame-src 'self' https://www.youtube.com https://www.youtube-nocookie.com https://open.spotify.com https://embed.acast.com https://player.vimeo.com https://w.soundcloud.com https://bandcamp.com https://codepen.io; connect-src 'self' https: https://cdn.jsdelivr.net; base-uri 'self'; form-action 'self' https:" always;
        add_header Cache-Control $sw_cache_control always;
