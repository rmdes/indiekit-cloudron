# Shared nginx configuration — http level (maps, proxy cache).
# Included by nginx.conf.template and by per-site nginx.conf files.
# Edit here, never in a copy: a block duplicated across site configs is
# how the service worker Cache-Control fix went missing from two sites.
# Site-specific maps stay in the including file (rmendes deliberately
# omits the AI-crawler map, for instance).

    map $http_x_forwarded_host $proxy_host {
        default $http_x_forwarded_host;
        ""      $host;
    }

    # ActivityPub content negotiation — detect AP clients by Accept header
    map $http_accept $is_activitypub {
        default 0;
        "~*application/activity\+json" 1;
        "~*application/ld\+json" 1;
    }

    # Does the client accept HTML? Microformats consumers list activity+json
    # alongside text/html, so matching activity+json alone hands them AS2 they
    # cannot parse. IndieNews, for example, sends:
    #   application/mf2+json, application/activity+json, text/html, ...
    # and silently received AS2 instead of the post markup, so every submission
    # failed with no_link_found. Real AS2 clients (Mastodon, Misskey) never
    # send text/html at all, which is what makes this a safe discriminator.
    # First matching regex wins, so the de-prioritised case is listed first:
    # text/html;q=0 means "only if nothing else", not a preference for HTML.
    map $http_accept $accepts_html {
        default 0;
        "~*text/html\s*;\s*q=0" 0;
        "~*text/html" 1;
    }

    # Serve AS2 only to clients that cannot take HTML
    map "$is_activitypub:$accepts_html" $serve_activitypub {
        default 0;
        "1:0" 1;
    }

    # Markdown content negotiation — detect AI agents requesting text/markdown
    map $http_accept $wants_markdown {
        default 0;
        "~*text/markdown" 1;
    }

    # A stale service worker keeps serving an old build, so it must be
    # revalidated on every request. Empty for every other URI — add_header skips
    # a header whose value is empty — which avoids putting an add_header inside
    # the location block, where it would stop the server-level security headers
    # from being inherited for that request.
    map $uri $sw_cache_control {
        default "";
        /serviceworker.js "no-cache";
    }

    # Legacy URL redirects (optional - populated via sites/<site>/config/redirects.map)
    map $uri $redirect_uri {
        default "";
        include /app/pkg/redirects.map;
    }

    # Legacy URL redirects (optional - populated via sites/<site>/config/old-blog-redirects.map)
    map $uri $old_blog_redirect {
        default "";
        include /app/pkg/old-blog-redirects.map;
    }


    # ── ActivityPub federation cache ──────────────────────────────────
    # Absorbs "thundering herd" when a post goes viral and hundreds of
    # Mastodon instances simultaneously fetch actor, featured, notes.
    # Only GET/HEAD is cached; POST /inbox always reaches Node.js.
    proxy_cache_path /run/nginx-ap-cache levels=1:2 keys_zone=activitypub:10m
                     max_size=100m inactive=10m use_temp_path=off;

    # Skip cache for AP admin pages (session-dependent HTML)
    map $uri $ap_skip_cache {
        default 0;
        "~^/activitypub/admin" 1;
    }

