name: Build & Push Docker Image

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version_override:
        description: "Override version tag (leave empty to use CloudronManifest.json)"
        required: false
        type: string

env:
  REGISTRY_GHCR: ghcr.io
  REGISTRY_DH: docker.io
  IMAGE: rmdes/indiekit-cloudron
  # The public image is built from the generic overlay in examples/site-default/,
  # which carries no private per-site data and takes its plugin set from the
  # registry's `default_enabled` flags. sites/ is gitignored — an operator's own
  # overlays live in a separate repository cloned there — so the build copies the
  # example into sites/default/ first (see the step below). Never point this at a
  # real deployment overlay.
  SITE: default

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false

      - name: Install compose script dependencies
        run: npm ci --prefix scripts

      - name: Materialize the generic overlay
        # sites/ is gitignored (operators clone their own overlay repository
        # there), so a fresh checkout has no sites/default/. The Makefile reads
        # sites/<site>/config/, so copy the tracked example into place first.
        run: |
          mkdir -p sites
          cp -R examples/site-default sites/default
          test -f sites/default/config/plugins.yaml

      - name: Compose plugin set from registry
        run: make compose SITE="$SITE"

      - name: Prepare generic config
        # Materializes nginx.conf / redirects.map / old-blog-redirects.map.
        # sites/default/config/ intentionally ships none of them, so prepare
        # falls back to the repo-root *.template files — the generic defaults.
        run: make prepare SITE="$SITE"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract version
        id: version
        env:
          VERSION_OVERRIDE: ${{ inputs.version_override }}
        run: |
          if [ -n "$VERSION_OVERRIDE" ]; then
            echo "tag=${VERSION_OVERRIDE}" >> "$GITHUB_OUTPUT"
          else
            VERSION=$(node -p "require('./CloudronManifest.json').upstreamVersion")
            echo "tag=${VERSION}" >> "$GITHUB_OUTPUT"
          fi
          echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY_GHCR }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY_DH }}
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          build-args: |
            SITE=${{ env.SITE }}
          tags: |
            ${{ env.REGISTRY_DH }}/${{ env.IMAGE }}:latest
            ${{ env.REGISTRY_DH }}/${{ env.IMAGE }}:${{ steps.version.outputs.tag }}
            ${{ env.REGISTRY_DH }}/${{ env.IMAGE }}:sha-${{ steps.version.outputs.sha }}
            ${{ env.REGISTRY_GHCR }}/${{ env.IMAGE }}:latest
            ${{ env.REGISTRY_GHCR }}/${{ env.IMAGE }}:${{ steps.version.outputs.tag }}
            ${{ env.REGISTRY_GHCR }}/${{ env.IMAGE }}:sha-${{ steps.version.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
